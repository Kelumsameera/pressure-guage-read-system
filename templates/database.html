<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pressure Gauge Data Viewer</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <a class="navbar-brand" href="#">Pressure Gauge Data Viewer</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" 
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
</nav>

<!-- Main container -->
<div class="container my-5">

    <h2 class="mb-4">Filter Pressure Gauge Data</h2>

    <form method="POST" class="mb-4">
        <div class="form-row">
            <div class="form-group col-md-4">
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required class="form-control" value="{{ selected_date }}">
            </div>
            <div class="form-group col-md-4">
                <label for="start_time">Start Time:</label>
                <input type="time" id="start_time" name="start_time" required class="form-control" value="{{ start_time }}">
            </div>
            <div class="form-group col-md-4">
                <label for="end_time">End Time:</label>
                <input type="time" id="end_time" name="end_time" required class="form-control" value="{{ end_time }}">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>

    {% if data %}
    <h3>Results:</h3>
    <div class="table-responsive">
        <table class="table table-bordered table-striped">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Device Name</th>
                    <th>Value</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody>
                {% for row in data %}
                <tr>
                    <td>{{ row[0] }}</td>
                    <td>{{ row[1] }}</td>
                    <td>{{ row[2] }}</td>
                    <td>{{ row[3] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <form action="/export_excel" method="POST" class="mt-3">
        <input type="hidden" name="date" value="{{ selected_date }}">
        <input type="hidden" name="start_time" value="{{ start_time }}">
        <input type="hidden" name="end_time" value="{{ end_time }}">
        <button type="submit" class="btn btn-success">Export to Excel</button>
    </form>
    {% endif %}
</div>

<!-- Footer -->
<footer class="bg-primary text-white text-center py-3 fixed-bottom">
    &copy; 2025 flexicare Lanka Pressure Gauge Data Viewer. All rights reserved.
</footer>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

</body>
</html>
