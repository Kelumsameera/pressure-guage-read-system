 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>📊 History Chart - Scrollable & Zoom/Pan</title>

<!-- Chart.js + Zoom Plugin -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

<!-- Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    margin: 0;
    padding-top: 60px;
    text-align: center;
  }
  nav {
    background-color: #007bff;
    position: fixed;
    top: 0;
    width: 100%;
    padding: 12px 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    z-index: 1000;
  }
  nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
    padding: 6px 12px;
    border-radius: 4px;
    transition: background-color 0.3s ease;
  }
  nav a:hover, nav a.active { background-color: #0056b3; }

  h2 { font-size: 1.8em; margin-top: 20px; padding: 0 10px; }

  form { margin-top: 15px; }
  label { margin-right: 8px; }
  input, select, button {
    margin: 6px;
    padding: 6px 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
  }
  button {
    cursor: pointer;
    background-color: #007bff;
    color: white;
    border: none;
    transition: background 0.3s ease;
  }
  button:hover { background-color: #0056b3; }

  /* Scrollable chart wrapper */
  .chartAreaWrapper {
    width: 90%;          /* Viewport width */
    overflow-x: scroll;  /* Horizontal scroll */
    margin: 20px auto;
    border: 1px solid #ccc;
    padding: 10px 0;
  }
  .chartWrapper {
    position: relative;
    width: 1200px;       /* Chart width larger than viewport */
    height: 400px;
  }
  .chartWrapper > canvas {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: all; /* Enable zoom/pan events */
  }

  @media (max-width: 600px) {
    nav { flex-direction: column; gap: 10px; }
    h2 { font-size: 1.5em; }
  }
</style>
</head>
<body>

<!-- Navigation -->
<nav>
  <a href="/"><i class="fa-solid fa-signal"></i> Realtime</a>
  <a href="/database"><i class="fa-solid fa-database"></i> Database</a>
  <a href="/chart"><i class="fa-solid fa-chart-line"></i> Chart</a>
  <a href="/about"><i class="fa-solid fa-circle-info"></i> About</a>
  <a href="/history" class="active"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
</nav>

<h2>📊 History Chart - Scrollable & Zoom/Pan</h2>

<form method="get" action="/history">
  <label for="start_datetime">Start Time:</label>
  <input type="datetime-local" name="start_datetime" id="start_datetime" required>

  <label for="end_datetime">End Time:</label>
  <input type="datetime-local" name="end_datetime" id="end_datetime" required>

  <label for="device">Sensor:</label>
  <select name="device" id="device">
    <option value="">-- All Sensors --</option>
    {% for device in devices %}
      <option value="{{ device }}" {% if device == selected_device %}selected{% endif %}>{{ device }}</option>
    {% endfor %}
  </select>

  <button type="submit"><i class="fa-solid fa-filter"></i> Filter</button>
</form>

<!-- Scrollable chart -->
<div class="chartAreaWrapper">
  <div class="chartWrapper">
    <canvas id="historyChart" width="1200" height="400"></canvas>
  </div>
</div>

<button onclick="downloadCSV()"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
<button onclick="chart.resetZoom()"><i class="fa-solid fa-magnifying-glass-minus"></i> Reset Zoom</button>

<script>
  const labelsData = JSON.parse('{{ labels | tojson | safe }}');
  const valuesData = JSON.parse('{{ values | tojson | safe }}');

  const ctx = document.getElementById('historyChart').getContext('2d');

  const datasets = Object.keys(labelsData).map(device => {
    const color = '#' + ('000000' + Math.floor(Math.random()*16777215).toString(16)).slice(-6);
    return {
      label: device,
      data: labelsData[device].map((timestamp, i) => ({
        x: timestamp,
        y: valuesData[device][i]
      })),
      borderColor: color,
      backgroundColor: color+'33',
      fill: true,
      tension: 0.4
    };
  });

  const chart = new Chart(ctx, {
    type: 'line',
    data: { datasets },
    options: {
      responsive: false,
      maintainAspectRatio: false,
      scales: {
        x: {
          type: 'time',
          time: {
            tooltipFormat: 'YYYY-MM-DD HH:mm:ss',
            displayFormats: { second:'HH:mm:ss', minute:'HH:mm', hour:'HH:mm' }
          },
          title: { display: true, text: 'Timestamp' }
        },
        y: {
          title: { display: true, text: 'Value (Pa)' }
        }
      },
      plugins: {
        legend: { display: true, position: 'top' },
        zoom: {
          pan: { enabled: true, mode: 'x' },   // horizontal pan only
          zoom: {
            wheel: { enabled: true },
            pinch: { enabled: true },
            mode: 'x'  // zoom only X-axis
          }
        }
      }
    }
  });

  // CSV export
  function downloadCSV() {
    let csvContent = "data:text/csv;charset=utf-8,Device,Timestamp,Value\n";
    Object.keys(labelsData).forEach(device => {
      labelsData[device].forEach((timestamp, i) => {
        csvContent += `${device},${timestamp},${valuesData[device][i]}\n`;
      });
    });
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "sensor_data.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>

</body>
</html>
