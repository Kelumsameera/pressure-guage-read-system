<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pressure Guage Multi-Room Dashboard</title>
  <script src="https://cdn.socket.io/4.3.2/socket.io.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding-top: 60px;
      text-align: center;
    }
    nav {
      background-color: #007bff;
      position: fixed;
      top: 0;
      width: 100%;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 1000;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      padding: 6px 12px;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }
    nav a:hover, nav a.active {
      background-color: #0056b3;
    }

    h1 {
      font-size: 1.8em;
      margin-top: 20px;
      padding: 0 10px;
    }

    .cards-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      width: 300px;
      max-width: 90vw;
      flex: 1 1 280px;
    }

    .card h2 {
      font-size: 1.3em;
    }

    .value {
      font-size: 2.5em;
      color: #007BFF;
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #007bff;
      color: white;
      text-align: center;
      padding: 12px 0;
      font-size: 14px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
    }

    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        gap: 10px;
      }
      h1 {
        font-size: 1.5em;
      }
      .value {
        font-size: 2em;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/">Realtime</a>
    <a href="/database">Database</a>
    <a href="/chart">Chart</a>
    <a href="/about">About</a>
    <a href="/history">History</a>
  </nav>

  <h1>Live Pressure Guage Data Dashboard</h1>

  <div class="cards-container">
    <div class="card" id="production_clean_room">
      <h2>Production Clean Room</h2>
      <div class="value">--</div>
    </div>
    <div class="card" id="assembly_clean_room">
      <h2>Assembly Clean Room</h2>
      <div class="value">--</div>
    </div>
  </div>

  <footer>
    &copy; 2025 Flexicare-Lanka - Pressure Gauge Data Monitoring System
  </footer>

  <script>
    const socket = io();
    socket.on('modbus_update', function(data) {
      const card = document.getElementById(data.device);
      if (card) {
        card.querySelector('.value').innerText = data.value + " Pa";
      }
    });
  </script>
</body>
</html>
